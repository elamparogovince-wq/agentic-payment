services:
  - type: web
    name: aeropay-agentic-payment
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start --workspace @aeropay/server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: VELO_CHECKOUT_ASSET
        value: native
      - key: VELO_CHECKOUT_AMOUNT
        value: "10.00"
      - key: PAYMENT_ASSET_LABEL
        value: XLM
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first --no-network-family-autoselection
